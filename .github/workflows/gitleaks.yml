# 푸시·PR마다 git 기록 전체에서 비밀값(키, 토큰, 비밀번호)이 커밋됐는지 검사한다.
# git 에 올라간 파일만 읽으므로 node_modules·빌드 결과물은 대상이 아니고,
# lock·캐시 파일과 테스트용 가짜 값은 .gitleaks.toml / .gitleaksignore 에서 제외한다.
name: gitleaks

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: gitleaks-${{ github.ref }}
  cancel-in-progress: true

jobs:
  scan:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    env:
      GITLEAKS_VERSION: 8.30.1
      GITLEAKS_SHA256: 551f6fc83ea457d62a0d98237cbad105af8d557003051f41f3e7ca7b3f2470eb
    steps:
      - uses: actions/checkout@v5
        with:
          fetch-depth: 0

      - name: Install gitleaks
        run: |
          curl -sSfL -o gitleaks.tar.gz \
            "https://github.com/gitleaks/gitleaks/releases/download/v${GITLEAKS_VERSION}/gitleaks_${GITLEAKS_VERSION}_linux_x64.tar.gz"
          echo "${GITLEAKS_SHA256}  gitleaks.tar.gz" | sha256sum -c -
          tar -xzf gitleaks.tar.gz -C "$RUNNER_TEMP" gitleaks
          rm gitleaks.tar.gz

      - name: Scan git history
        run: |
          "$RUNNER_TEMP/gitleaks" git . \
            --log-opts="--all" \
            --redact \
            --no-banner \
            --exit-code 1
